<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-local.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const useDark = savedTheme ? savedTheme === "dark" : prefersDark;

            if (useDark) {
                document.documentElement.classList.add("dark");
            }
        })();

        function toggleTheme() {
            const root = document.documentElement;
            const nextDark = !root.classList.contains("dark");
            root.classList.toggle("dark", nextDark);
            localStorage.setItem("theme", nextDark ? "dark" : "light");

            const label = document.getElementById("login-theme-label");
            if (label) {
                label.textContent = nextDark ? "Tema claro" : "Tema dark";
            }
        }
    </script>
</head>

<body class="min-h-screen bg-slate-100 text-gray-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
    <div class="flex min-h-screen items-center justify-center px-6 py-10">
        <div class="w-full max-w-md rounded-[28px] bg-white p-8 shadow-lg shadow-slate-900/10 transition-colors duration-300 dark:bg-slate-900 dark:shadow-black/30">
            <div class="mb-6 flex justify-end">
                <button
                    type="button"
                    onclick="toggleTheme()"
                    class="inline-flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
                >
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v2.5"></path>
                        <path d="M12 18.5V21"></path>
                        <path d="M3 12h2.5"></path>
                        <path d="M18.5 12H21"></path>
                        <circle cx="12" cy="12" r="3.5"></circle>
                    </svg>
                    <span id="login-theme-label">Tema dark</span>
                </button>
            </div>
            <div class="mb-8 flex flex-col items-center">
                <img
                    src="{{ url_for('static', filename='img/ebm.png') }}"
                    class="mb-6 h-20 w-auto opacity-90"
                    alt="Logo EBM"
                >
                <h1 class="text-center text-2xl font-bold text-slate-900 dark:text-slate-100">
                    Captação de Recurso - EBM
                </h1>
            </div>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    <div class="mb-6 space-y-3">
                        {% for categoria, mensagem in mensagens %}
                            <div class="rounded-2xl border px-4 py-3 text-sm font-medium {% if categoria == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300{% else %}border-rose-200 bg-rose-50 text-rose-700 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300{% endif %}">
                                {{ mensagem }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
                <div class="flex flex-col">
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Usuario</label>
                    <input
                        type="text"
                        name="login"
                        required
                        class="mt-2 rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-500 dark:focus:ring-slate-700"
                    >
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-200">Senha</label>
                    <input
                        type="password"
                        name="senha"
                        required
                        class="mt-2 rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-500 dark:focus:ring-slate-700"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full rounded-xl bg-slate-950 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800 dark:bg-cyan-400 dark:text-slate-950 dark:hover:bg-cyan-300"
                >
                    Entrar
                </button>
            </form>
        </div>
    </div>
    <script>
        const loginThemeLabel = document.getElementById("login-theme-label");
        if (loginThemeLabel) {
            loginThemeLabel.textContent = document.documentElement.classList.contains("dark") ? "Tema claro" : "Tema dark";
        }
    </script>
</body>
</html>
