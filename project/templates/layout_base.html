<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Início{% endblock %} | AppCaptação</title>

    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const useDark = savedTheme ? savedTheme === "dark" : prefersDark;

            if (useDark) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-local.css', v='20261016-2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20261016-2') }}">
    <script src="{{ url_for('static', filename='js/menu.js', v='20261016-2') }}" defer></script>
    <script src="{{ url_for('static', filename='js/modal.js', v='20261016-2') }}" defer></script>
</head>

<body class="app-shell antialiased text-slate-900 transition-colors duration-300 dark:text-slate-100">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-xl focus:bg-white focus:px-4 focus:py-3 focus:text-sm focus:font-semibold focus:text-slate-900 focus:shadow-soft">Ir para o conteúdo</a>
    <div class="relative flex min-h-screen">
        <div class="pointer-events-none absolute inset-0 overflow-hidden">
            <div class="absolute left-[-120px] top-[-80px] h-72 w-72 rounded-full bg-cyan-300/25 blur-3xl dark:bg-cyan-500/10"></div>
            <div class="absolute bottom-[-120px] right-[-120px] h-96 w-96 rounded-full bg-sky-200/35 blur-3xl dark:bg-sky-500/10"></div>
        </div>

        {% include "components/menu.html" %}

        <main id="conteudo" tabindex="-1" class="relative flex-1 overflow-y-auto focus:outline-none">
            <div class="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-6 py-6 lg:px-10">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    <script>
        function syncThemeButtons() {
            const isDark = document.documentElement.classList.contains("dark");
            document.querySelectorAll("[data-theme-label]").forEach((label) => {
                label.textContent = isDark ? "Tema claro" : "Tema escuro";
            });
            // Com o menu recolhido, a dica do botao repete o rotulo (static/js/menu.js).
            if (typeof atualizarDicasDoMenu === "function") atualizarDicasDoMenu();
        }

        function toggleTheme() {
            const root = document.documentElement;
            const nextDark = !root.classList.contains("dark");
            root.classList.toggle("dark", nextDark);
            localStorage.setItem("theme", nextDark ? "dark" : "light");
            syncThemeButtons();
        }

        document.addEventListener("DOMContentLoaded", syncThemeButtons);
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
